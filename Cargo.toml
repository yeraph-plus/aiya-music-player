[workspace]
resolver = "2"
members = ["src-tauri", "crates/aiya-data"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2.5.0"
lofty = "0.25.4"
tracing = "0.1"
uuid = { version = "1", features = ["v5"] }
base64 = "0.22"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
