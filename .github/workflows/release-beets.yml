# beets 侧独立发布：只发 Windows 的免配置套件包 + 安装器
#
# ## 为什么从 release.yml 拆出来（docs/51 §3.3）
#
# 原先 beets 的两个产物跟在播放器 release 里一起打，带来两个问题：
#   1. beets 的改动（插件表、依赖、打包脚本）必须等一次播放器发版才能上线；
#   2. 宿主原先写死 `releases/latest/download`，两个发布节奏互相踩——单独发
#      beets 会让 `latest` 指过去，而播放器 release 不带 beets 资产时又 404。
#
# 拆开之后：本工作流只产出 `aiya-beets-*`，只有**一条固定通道**，没有版本
# 分支（2026-10-31 拍板：外围包手动发布、每次更新都要整套实测，版本 release
# 只会积灰）——推新删旧，`beets-portable` 这一条 release 永远是最新发布：
#
#   · release 标 `--prerelease`：GitHub 的 "Latest" 徽章永远只落在播放器
#     release 上（起用 "latest" 之类的标注容易误导）。
#   · 宿主常量指向 `releases/download/beets-portable/...`，固定 URL、零 API
#     查询，与播放器发布完全解耦。
#
# ## 触发方式
#
#   · 手动（workflow_dispatch）：默认**只构建不发布**，产物落在 Actions artifacts。
#     勾 `publish` 才发布——发布是不可撤销的，不能手滑。
#   · 打 tag `beets-portable`：构建后直接发布（固定通道推新删旧）。
#     本地发布动作 = `git tag -f beets-portable && git push -f origin beets-portable`。
#
# ## 只发 Windows
#
# 应用当前只规划 Windows（2026-10-27 拍板）。脚本里留了 `--runtime` 口子，
# 但这里不矩阵化——发一个没验证过的平台发布物，比不发更糟。
#
# ## 签名：不做（2026-10-27 拍板）
# 与播放器一致：未签名，用户首次运行由 SmartScreen 提示"未知发布者"。

name: Release beets

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "勾选后发布（推新删旧：整体替换 beets-portable 通道）"
        type: boolean
        default: false
  push:
    tags:
      - "beets-portable"

permissions:
  contents: write

concurrency:
  # 同一分支上并发构建会抢 uv 缓存与 dist/ 目录；发布本身也不需要并行
  group: release-beets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 打 beets 发布物（win-x64）
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      # Windows runner 的**管道** stdout 按 locale 编码（英文镜像是 cp1252），
      # 中文 print 会 UnicodeEncodeError。两个 build 脚本各自 reconfigure 兜底，
      # 这里再设一次是为了 pip / uv 之类的**子进程**（它们继承 env、不继承我们的
      # reconfigure）。两处都要，缺一处就会在别的路径上复发。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # uv 是**打包工具**不是运行时：它按 embeddable 解释器解析 wheel
      # （实测 numpy 拿到 cp314 tag），比 pip 快一个量级。
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 建开发环境（跑构建脚本与契约测试）
        run: |
          python -m venv beets-tool/.venv
          beets-tool/.venv/Scripts/python -m pip install --upgrade pip
          beets-tool/.venv/Scripts/pip install -r beets-tool/requirements.lock
          beets-tool/.venv/Scripts/pip install -e "beets-tool[dev]"

      # 表错一个键不会报错，只会让发布物里少一个插件、或者让索引家收进写盘
      # 插件。所以打包前先过一遍表契约（负向用例也在里面）。
      - name: 插件表契约
        run: beets-tool/.venv/Scripts/python beets-tool/tests/catalog_contract.py

      - name: 打免配置套件包
        run: beets-tool/.venv/Scripts/python beets-tool/tools/build_bundle.py --uv uv

      - name: 打安装器（.pyz）
        run: beets-tool/.venv/Scripts/python beets-tool/tools/build_installer.py

      # 名字错了宿主就 404，所以在这里硬校验一次。
      # 套件包的体积下限同时是"外置工具进没进包"的粗门禁：Essentia Gaia 构建
      # （exe+Qt5Core）与 12 件 SVM 模型（解出 ~43MB）占了包体的大头，丢了它们
      # 体积会掉到 55MB 以下（docs/54；2026-10-31 起 highlevel 随包）。
      - name: 校验产物名与体积
        run: |
          $expected = @{
            "beets-installer.pyz"        = 20KB
            "beets-portable-win-x64.zip" = 55MB
          }
          foreach ($f in $expected.Keys) {
            $p = "beets-tool/dist/$f"
            if (-not (Test-Path $p)) { throw "缺少发布物：$p" }
            $len = (Get-Item $p).Length
            if ($len -lt $expected[$f]) { throw "$f 只有 $len 字节，太小了" }
            Write-Host ("{0}  {1:N0} KB" -f $f, ($len / 1KB))
          }

      # 宿主下载发布物后会比对 sha256（beets.rs verify_checksum，发布前审查
      # P1-6）：清单缺失时宿主拒绝安装。标准 sha256sum 两空格格式（二进制模式），
      # 宿主按行尾文件名精确匹配。
      - name: 生成 SHA256SUMS
        run: |
          $files = @("beets-installer.pyz", "beets-portable-win-x64.zip")
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash -Algorithm SHA256 "beets-tool/dist/$f").Hash.ToLower()
            "$h  $f"
          }
          $lines | Set-Content -Path "beets-tool/dist/SHA256SUMS" -Encoding ascii
          Get-Content "beets-tool/dist/SHA256SUMS"

      # "免配置"是可验证的：解开包，用**包里的**解释器 import 预置插件的模块，
      # 再按宿主真实的布局（{data_root}\beets-tool\bundle）让它自己找 bin/ 里的
      # 外置工具——xtractor 能不能用，取决于这一步（docs/54）。
      - name: 解开套件包自检
        run: |
          $root = Join-Path $env:RUNNER_TEMP "aiya-check"
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          $dst = Join-Path $root "beets-tool\bundle"
          Expand-Archive -Path "beets-tool/dist/beets-portable-win-x64.zip" -DestinationPath $dst -Force
          $py = Join-Path $dst "python.exe"
          $m = Get-Content (Join-Path $dst "manifest.json") -Raw | ConvertFrom-Json
          $bins = ($m.binaries | ForEach-Object { $_.target }) -join ","
          Write-Host "manifest: version=$($m.version) protocol=$($m.protocolVersion) plugins=$($m.plugins -join ',') binaries=$bins"
          & $py -m aiya_beets version
          if ($LASTEXITCODE -ne 0) { throw "包内 aiya_beets 跑不起来" }
          foreach ($mod in @("bs4")) {
            & $py -c "import $mod"
            if ($LASTEXITCODE -ne 0) { throw "预置插件依赖缺失：$mod" }
          }
          if (-not $m.binaries) { throw "manifest 里没有 binaries：包没带外置工具" }
          foreach ($b in $m.binaries) {
            $p = Join-Path $dst ("bin\" + $b.target)
            if (-not (Test-Path $p)) { throw "包内缺少外置工具：$p" }
            Write-Host ("  {0}  {1:N0} B" -f $b.target, (Get-Item $p).Length)
          }
          # 工具侧从 AIYA_BEETS_HOME 推 bin 目录：{home}\..\beets-tool\{bin,bundle\bin}
          $env:AIYA_BEETS_HOME = Join-Path $root "beets"
          $names = ($m.binaries | ForEach-Object { $_.name }) -join ","
          $text = (& $py -m aiya_beets bins --check --only $names | Out-String)
          Write-Host $text
          if ($LASTEXITCODE -ne 0) { throw "bins --check 退出码 $LASTEXITCODE" }
          if ($text -notmatch '"missing":\s*\[\]') { throw "包内工具不全（bins --check 报了 missing）" }

          # Gaia/SVM 冒烟：模型在位时 highlevel 必须产出（模型缺失/不配 = 整段
          # 消失而表面"跑成功"，正是 2026-10-31 之前的状态——这道烟堵的就是它）
          python beets-tool/tools/essentia_smoke.py --bundle $dst

      # 三处版本必须同一个数字：包内 __version__、manifest、tag。
      # 以前 build_bundle 硬编码 0.1.0 而包是 0.2.0，发出去没人发现（docs/51 §0）。
      - name: 版本一致性
        run: |
          $pkg = (beets-tool/.venv/Scripts/python -c "import sys; sys.path.insert(0,'beets-tool/src'); from aiya_beets import __version__; print(__version__)").Trim()
          $man = (Get-Content "beets-tool/dist/bundle/manifest.json" -Raw | ConvertFrom-Json).version
          Write-Host "包内=$pkg manifest=$man"
          if ($pkg -ne $man) { throw "manifest 版本 $man 与包内 $pkg 不一致" }
          # 版本只随包走（pyproject / __init__ / manifest），发布通道不再带版本号
          "BEETS_VERSION=$pkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # 手动触发的默认产物：不发布也能拿到文件去真机试
      - uses: actions/upload-artifact@v4
        with:
          name: aiya-beets-win-x64
          path: |
            beets-tool/dist/beets-installer.pyz
            beets-tool/dist/beets-portable-win-x64.zip
            beets-tool/dist/SHA256SUMS
          retention-days: 14

      # ---------------------------------------------------------------
      # 发布：手动勾了 publish，或者打了 beets-portable tag。
      # 推新删旧：整条 release 连旧 tag 一起删掉再重建，通道上永远只有
      # 最新一次发布，不留版本分支。删-建之间 URL 短暂 404，窗口分钟级。
      # ---------------------------------------------------------------
      - name: 发布到固定通道（推新删旧）
        if: github.ref == 'refs/tags/beets-portable' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @(
            "beets-tool/dist/beets-installer.pyz",
            "beets-tool/dist/beets-portable-win-x64.zip",
            "beets-tool/dist/SHA256SUMS"
          )
          $tag = "beets-portable"

          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { throw "删除旧 release $tag 失败" }
          }

          # --prerelease：`releases/latest` 会跳过 prerelease，通道不抢播放器的 "Latest"。
          # 标题用日期不用小版本：只有一版滚动打包，别干扰应用主体的版本线。
          # 说明只写用途与现状，不写发布机制。
          $date = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTime]::UtcNow, 'China Standard Time').ToString('yyyy-MM-dd')
          gh release create $tag --prerelease --title "beets portable（$date）" `
            --notes "AIYA Music 的 Beets 预配置环境（Windows x64）：自带 Python 解释器，预置歌词抓取、封面抓取、MusicBrainz 同步、音频特征插件与 Essentia 提取器，解压即用，不需要本机 Python。在播放器「Beets → 安装 → 预配置环境」一键下载安装，随包附 SHA256SUMS 供播放器校验。包内工具版本 $env:BEETS_VERSION，协议 v2。"
          if ($LASTEXITCODE -ne 0) { throw "创建 $tag 失败" }
          gh release upload $tag $files --clobber
          if ($LASTEXITCODE -ne 0) { throw "上传到 $tag 失败" }
          Write-Host "OK $tag（推新删旧）"
