# 常规校验（PR 与 push 到 main 都跑）
#
# 与本地 `npm run verify` 在"UI 行为也要被门禁看着"这一层已对齐（e2e 本来就在
# 这里，2026-10-30 起本地 verify 也纳入了），但**不是逐条相同**：
#   · beets job = verify 链里的全部 9 个 beets smoke（2026-11-04 补齐 lock /
#     config / enrich——此前缺口真的咬过人：uninstall 的 ImportError 与 bins
#     的过期断言都发生在不在 CI 的套件里，本地 verify 红而 CI 绿）
#   · 本地 verify 还有 `check:fmt` 与 `check:style:strict`，这里没有对应步骤。
#
# 为什么是 windows-latest 而不是 ubuntu：
#   · 本体只在 Windows 上发布（WASAPI / NSIS），跨平台绿灯没有意义
#   · e2e 用系统 Edge（playwright.config.ts 的 channel: 'msedge'），Linux 上没有
#
# 首次推上去之后要盯一次：这套 YAML 没有在 Actions 上实跑过，
# 本地验证的是命令本身（verify 全绿），不是 runner 环境。
#
# 2026-10-27 第一次实跑（run 40451976473）两个 job 都红，暴露的都是
# **"本地有、干净检出没有"** 这类假设，不是逻辑错误：
#   · verify：`cargo test` 编译 src-tauri 时 build.rs 要 bundle.resources 里的
#     sidecar（binaries/aiya-audio-host-*.exe），干净检出没有 → 已把
#     `npm run build:sidecar` 放进 `test:all` 的第一步
#   · beets：三个 smoke 把音源写死成开发机的 `D:\MUSIC_Player\test-music`
#     → 改为 `beets-tool/tests/_testmusic.py`，没有真音源就现场合成

name: CI · 常规校验

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Rust + 前端 + e2e
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # e2e 用系统 Edge，不下载 Playwright 浏览器（省 150 MB，版本跟系统走）
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 安装前端依赖
        run: npm ci --prefix ui

      # = cargo test --workspace
      # + svelte-check
      # + 依赖图无环（check:deps）
      # + 边界门禁（check:boundary）
      # + 协议镜像一致（proto:check）
      # + vite build
      # 第一步就会 `npm run build:sidecar`：src-tauri 的 build.rs 要
      # bundle.resources 里的 binaries/aiya-audio-host-*.exe，干净检出没有这个
      # 产物，直接 `cargo test` 会在 build script 阶段失败（2026-10-27 首跑实测）
      - name: 单测与静态检查
        run: npm run test:all

      # clippy 带 -D warnings：2026-10-27 首次全量跑，清到 0 条后设成门禁。
      # 那一轮抓到一条 deny 级真问题（hls.rs 里 ADTS 头的空操作掩码会让
      # --all-targets 编译失败），说明它不是纯风格检查。
      # runner 自带 clippy，但显式装一次只多几秒，省得版本切换时莫名红。
      - name: clippy（-D warnings）
        run: rustup component add clippy && npm run check:clippy

      # ts-rs 生成物必须与 Rust 源一致：差异只有一个 doc comment 也算漂移
      - name: 契约生成物一致
        run: npm run gen:types:check

      # 注释文风门禁（docs/71 洞①）：strict 在本地 verify 有、CI 没有，等于
      # 门禁不存在——历史叙事与 docs 引用的新增只能靠本地自觉。日期/引用在
      # 任何注释形态都是阻断（存量走 allowlist 棘轮，只减不增）；beets-tool
      # 的 Python 侧（含 docstring）走 comment-gov --check，同一白名单。
      # verify.py 是批次工具：干净检出恒过；工作区带未提交注释改动时按
      # 剥注释零差异判。
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 注释文风门禁
        run: |
          npm run check:style:strict
          npm run check:style:py
          python -I tools/comment-gov/verify.py

      - name: e2e（mock 后端 + 系统 Edge）
        run: npm --prefix ui run test:e2e

      - name: 失败时留存 e2e 报告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7

  # 生产平台是 Linux（Docker 部署 aiya-server），而上面一直只有 windows：
  # 所有 cfg(unix) 测试（host-core canon_path 的 unix 8 条、extract_safely 的
  # unix_mode 还原路径……）从未在线上执行过——2026-11-09 canon_path 的
  # Windows 语义漏进 Linux 恰是这一类。本 job 跑 aiya-server 的完整依赖图：
  # {server, host-core, data, player, dto, beets-client, beets-store}，与
  # Dockerfile `cargo build -p aiya-server` 是同一编译面（Linux 可编译性有
  # Docker 实证）。刻意不含 src-tauri（miow/windows 系）与 aiya-audio
  # （wasapi 无 cfg 门，非 Windows 编不过）——它们进来的前提是先做平台解耦。
  # fmt 也挂在这里：平台无关，windows job 没这道闸（审查发现 ⑥）。
  linux-test:
    name: Linux · 跨平台 crate 测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: fmt（--check，平台无关）
        run: cargo fmt --check

      - name: test（aiya-server 依赖图全量，含 cfg(unix) 用例）
        # --no-fail-fast：unix 用例是首上线（68f4167），潜伏红会分层暴露——
        # fail-fast 一轮只揭一层，全量报告一轮看全。
        run: cargo test --no-fail-fast -p aiya-server -p aiya-host-core -p aiya-data -p aiya-player -p aiya-dto -p aiya-beets-client -p aiya-beets-store

  beets:
    name: beets 契约与维护 smoke
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      # runner 的默认 ANSI 代码页不是 UTF-8，而这三个 smoke 的 print 全是中文。
      # 不管 stdout 是管道还是控制台，Python 都会按 locale 编码输出，
      # cp1252 下第一个中文就 UnicodeEncodeError。开发机上永远是 UTF-8，看不出来。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # venv 路径必须是 beets-tool/.venv：package.json 的 smoke:* 脚本写死了
      # `beets-tool\.venv\Scripts\python.exe`（Windows runner 上是同一形态）
      - name: 建 beets 环境
        run: |
          python -m venv beets-tool/.venv
          beets-tool/.venv/Scripts/python -m pip install --upgrade pip
          beets-tool/.venv/Scripts/pip install -r beets-tool/requirements.lock
          beets-tool/.venv/Scripts/pip install -e "beets-tool[dev]"

      # 三个 smoke 各自独立，拆成三步是为了失败时一眼看出是哪一层。
      #
      # 每步都包一层 Tee-Object + `::error` 注解：失败时把最后 25 行贴到
      # **注解**里。理由很实际——job 日志要鉴权才能拉，注解是公开可读的；
      # 提交页上直接能看到断在哪一句，不用点进 Actions 再翻几百行。
      # `%` 必须先转义成 `%25`，否则正文里的 %0A 会被当成换行序列。
      - name: apply smoke（导入 / 同步）
        run: |
          $log = "smoke-apply.log"
          npm run smoke:beets 2>&1 | Tee-Object -FilePath $log | Write-Host
          if ($LASTEXITCODE -ne 0) {
            $lines = Get-Content $log | Select-Object -Last 25
            $tail = ($lines | ForEach-Object { $_ -replace '%', '%25' }) -join '%0A'
            Write-Host "::error title=apply smoke 失败::$tail"
            exit 1
          }

      - name: maintenance smoke（adopt / update / duplicates / move，15 断言）
        run: |
          $log = "smoke-maint.log"
          npm run smoke:maint 2>&1 | Tee-Object -FilePath $log | Write-Host
          if ($LASTEXITCODE -ne 0) {
            $lines = Get-Content $log | Select-Object -Last 25
            $tail = ($lines | ForEach-Object { $_ -replace '%', '%25' }) -join '%0A'
            Write-Host "::error title=maintenance smoke 失败::$tail"
            exit 1
          }

      # 59 条消息的协议契约。联网场景（album / albumError / done）默认跳过，
      # 要跑得设 AIYA_BEETS_ONLINE=1——CI 里不开，避免受网络与 MusicBrainz 限流影响
      - name: protocol contract（协议 v2）
        run: |
          $log = "smoke-proto.log"
          npm run smoke:proto 2>&1 | Tee-Object -FilePath $log | Write-Host
          if ($LASTEXITCODE -ne 0) {
            $lines = Get-Content $log | Select-Object -Last 25
            $tail = ($lines | ForEach-Object { $_ -replace '%', '%25' }) -join '%0A'
            Write-Host "::error title=protocol contract 失败::$tail"
            exit 1
          }

      # 插件表是五个消费方的唯一事实源（tools 打包、install 拼依赖、Rust 的
      # include_str!、UI 勾选、cfg 白名单），改坏一个键不会报错、只会静默
      # 少一项，所以它必须自己有一道门禁
      - name: plugin catalog contract（插件表）
        run: |
          $log = "smoke-catalog.log"
          npm run smoke:catalog 2>&1 | Tee-Object -FilePath $log | Write-Host
          if ($LASTEXITCODE -ne 0) {
            $lines = Get-Content $log | Select-Object -Last 25
            $tail = ($lines | ForEach-Object { $_ -replace '%', '%25' }) -join '%0A'
            Write-Host "::error title=plugin catalog contract 失败::$tail"
            exit 1
          }

      # 外置二进制（docs/53）：抽成员命中数、双哈希、probe、PATH 注入。
      # 这一层出错的形态是"文件看着在、其实跑不起来"，只能在落盘前后验。
      - name: binaries contract（外置工具落盘）
        run: |
          $log = "smoke-bins.log"
          npm run smoke:bins 2>&1 | Tee-Object -FilePath $log | Write-Host
          if ($LASTEXITCODE -ne 0) {
            $lines = Get-Content $log | Select-Object -Last 25
            $tail = ($lines | ForEach-Object { $_ -replace '%', '%25' }) -join '%0A'
            Write-Host "::error title=binaries contract 失败::$tail"
            exit 1
          }

      # 卸载（docs/55）：唯一会 rmtree 的入口。重点不是"删得干净"，
      # 是"不该删的时候一个字节都不动"——闸门全在负向用例里。
      - name: uninstall contract（卸载闸门）
        run: |
          $log = "smoke-uninstall.log"
          npm run smoke:uninstall 2>&1 | Tee-Object -FilePath $log | Write-Host
          if ($LASTEXITCODE -ne 0) {
            $lines = Get-Content $log | Select-Object -Last 25
            $tail = ($lines | ForEach-Object { $_ -replace '%', '%25' }) -join '%0A'
            Write-Host "::error title=uninstall contract 失败::$tail"
            exit 1
          }

      # 库文件锁（v2）：跨进程互斥、holder 上报、持锁进程被杀后 OS 立即释放。
      # 独立临时 AIYA_BEETS_HOME，不碰真实数据目录。
      - name: lock smoke（库文件锁）
        run: |
          $log = "smoke-lock.log"
          npm run smoke:lock 2>&1 | Tee-Object -FilePath $log | Write-Host
          if ($LASTEXITCODE -ne 0) {
            $lines = Get-Content $log | Select-Object -Last 25
            $tail = ($lines | ForEach-Object { $_ -replace '%', '%25' }) -join '%0A'
            Write-Host "::error title=lock smoke 失败::$tail"
            exit 1
          }

      # 双家隔离契约：索引家与用户库各过各的，负向用例验"闸不是装饰"。
      # 只用临时目录；jsonschema 由上面 [dev] extra 装好。
      - name: config contract（双家隔离）
        run: |
          $log = "smoke-config.log"
          npm run smoke:config 2>&1 | Tee-Object -FilePath $log | Write-Host
          if ($LASTEXITCODE -ne 0) {
            $lines = Get-Content $log | Select-Object -Last 25
            $tail = ($lines | ForEach-Object { $_ -replace '%', '%25' }) -join '%0A'
            Write-Host "::error title=config contract 失败::$tail"
            exit 1
          }

      # 索引增强全链路：协议逐行过 schema、音频文件字节不变、子进程不偷 stdin、
      # 幂等。假源靠套件自设的 AIYA_BEETS_ENRICH_PROBE=1，不联网。
      - name: enrich smoke（索引增强）
        run: |
          $log = "smoke-enrich.log"
          npm run smoke:enrich 2>&1 | Tee-Object -FilePath $log | Write-Host
          if ($LASTEXITCODE -ne 0) {
            $lines = Get-Content $log | Select-Object -Last 25
            $tail = ($lines | ForEach-Object { $_ -replace '%', '%25' }) -join '%0A'
            Write-Host "::error title=enrich smoke 失败::$tail"
            exit 1
          }

  # 依赖安全通告（RustSec advisory-db）：2026-11-06 盘点确认全仓从未跑过
  # advisory 扫描，bundled SQLite 等是周期性 CVE 源。失败 = 存在已知漏洞记录，
  # 先升级或收录ignore再合；无告警时这是纯只读检查（约 1 分钟）。
  audit:
    name: cargo-audit（RustSec 通告）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
