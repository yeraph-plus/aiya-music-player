# 发布工作流：构建安装包与 beets 发布物，挂到 GitHub Release 上
#
# ## 三类触发
#   · `v0.1.0`       播放器版本：NSIS 安装包 + 便携版 zip + beets 两个发布物一起挂上去
#   · `beets-v0.1.0` 只发 beets 工具：只产出两个 beets 文件
#   · 手动触发         **只构建不发布**（dry run）：把安装包、便携包与两个 beets 产物
#                     都真造一遍，验证构建链路，但最后一步跳过 `gh release create`。
#                     为什么需要它：release 工作流最容易坏的地方是"到打 tag 才发现"，
#                     而打 tag 会立刻产生一个公开 release，不能拿来试。
#                     手动触发时 `github.ref_name` 是分支名，所以构建条件写成
#                     "v* tag 或 dispatch"，上传条件写成"只在 tag 上"。
#
# **为什么播放器 release 也要带 beets 的两个文件**：
# `src-tauri/src/beets.rs` 的下载地址是
# `https://…/releases/latest/download/<asset>`，而 `latest` 指的是"最近创建的
# release"。如果 beets 单独发过一版，latest 就指向那个 release，播放器去下
# 安装包之外的东西会 404。把两个文件同时挂到播放器 release 上，
# `latest/download` 就永远能找到它们。
# 资产名必须是 `aiya-beets-installer.pyz` 与 `aiya-beets-bundle-win-x64.zip`
# ——它们是 `beets.rs` 里的 `INSTALLER_ASSET` / `BUNDLE_ASSET` 常量，
# 改名前先改常量，否则用户点安装就是 404。
#
# ## 签名：**决定不做**（2026-10-27）
# 不买代码签名证书：两个 exe 与安装包保持未签名，首次运行由 Windows SmartScreen
# 提示「未知发布者」，README 与便携包内的 README.txt 写明「更多信息 → 仍要运行」。
# 代价是 P0-6（杀软/声誉观察）永远带着一个已知的提示，收益是零成本、零证书运维。
# 所以本文件**没有**签名步骤——不是还没写，是决定不写。
#
# 作为补偿，发布物里多一份**便携版 zip**（`npm run portable`）：
# 免安装、不写注册表、数据全在解压目录的 data/ 下，用户看到安全提示时可以
# 先用它试，不必让安装程序落盘。
#
# 首次使用前确认：
#   1. 仓库 Settings → Actions → General 允许 workflow 写 content
#      （本文件已声明 permissions: contents: write，但组织策略可能更严）
#   2. `licenses/SOURCE-OFFER.txt` 里的源码地址已换成真实仓库地址（docs/35 P0-2）

name: Release

on:
  push:
    tags:
      - "v*"
      - "beets-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # Windows runner 的**管道** stdout 按 locale 编码（英文镜像是 cp1252），
      # 中文 print 会 UnicodeEncodeError。两个 build 脚本里已各自 reconfigure
      # 兜底，这里再设一次是为了 pip / beets 之类的**子进程**（它们继承 env、
      # 不继承我们的 reconfigure）。两处都要，缺一处就会在别的路径上复发。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # ---------------------------------------------------------------
      # beets 侧发布物（两条安装轨道的产物）
      # ---------------------------------------------------------------
      - name: 建 beets 环境
        run: |
          python -m venv beets-tool/.venv
          beets-tool/.venv/Scripts/python -m pip install --upgrade pip
          beets-tool/.venv/Scripts/pip install -r beets-tool/requirements.lock
          beets-tool/.venv/Scripts/pip install -e "beets-tool[dev]"

      - name: 打 beets 发布物（.pyz + 套件包）
        run: |
          beets-tool/.venv/Scripts/python beets-tool/tools/build_installer.py
          beets-tool/.venv/Scripts/python beets-tool/tools/build_bundle.py

      # 名字错了播放器就 404，所以在这里硬校验一次
      - name: 校验 beets 产物名
        run: |
          $expected = @("aiya-beets-installer.pyz", "aiya-beets-bundle-win-x64.zip")
          foreach ($f in $expected) {
            $p = "beets-tool/dist/$f"
            if (-not (Test-Path $p)) { throw "缺少发布物：$p" }
            $kb = [math]::Round((Get-Item $p).Length / 1KB)
            Write-Host "$f  ${kb} KB"
          }

      # ---------------------------------------------------------------
      # 播放器安装包（只在 v* tag 上构建）
      # ---------------------------------------------------------------
      - name: 安装前端依赖
        if: startsWith(github.ref_name, 'v') || github.event_name == 'workflow_dispatch'
        run: npm ci --prefix ui

      - name: 构建 NSIS 安装包
        if: startsWith(github.ref_name, 'v') || github.event_name == 'workflow_dispatch'
        run: npm run bundle

      # 便携版：把 release 的两个 exe 收成 zip（免安装、数据随目录走）。
      # 必须在 bundle 之后——它要的正是 bundle 编出来的 target/release/*.exe。
      - name: 打便携版
        if: startsWith(github.ref_name, 'v') || github.event_name == 'workflow_dispatch'
        run: npm run portable

      - name: 校验安装包与便携包
        if: startsWith(github.ref_name, 'v') || github.event_name == 'workflow_dispatch'
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*-setup.exe -ErrorAction SilentlyContinue
          if (-not $exe) { throw "没有产出 NSIS 安装包" }
          $exe | ForEach-Object { Write-Host $_.Name ([math]::Round($_.Length / 1MB, 2)) "MB" }
          $zip = Get-ChildItem target/release/bundle/portable/*-portable.zip -ErrorAction SilentlyContinue
          if (-not $zip) { throw "没有产出便携包" }
          $zip | ForEach-Object { Write-Host $_.Name ([math]::Round($_.Length / 1MB, 2)) "MB" }

      # ---------------------------------------------------------------
      # 发布
      # ---------------------------------------------------------------
      - name: 上传到 Release
        # 只在 tag 上发布：手动触发是 dry run（`github.ref_name` 那时是分支名，
        # 拿它去 create release 会建出一个叫 "main" 的版本）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @(
            "beets-tool/dist/aiya-beets-installer.pyz",
            "beets-tool/dist/aiya-beets-bundle-win-x64.zip"
          )
          if (Test-Path "target/release/bundle/nsis") {
            $files += (Get-ChildItem target/release/bundle/nsis/*-setup.exe).FullName
          }
          if (Test-Path "target/release/bundle/portable") {
            $files += (Get-ChildItem target/release/bundle/portable/*-portable.zip).FullName
          }
          gh release create $tag --title $tag --generate-notes $files 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "release 已存在，改为追加上传（--clobber）"
            gh release upload $tag $files --clobber
          }
