[package]
name = "aiya-audio"
version.workspace = true
edition.workspace = true
description = "AIYA Music 音频引擎：Symphonia 解码 + WASAPI 输出。不依赖 Tauri 与数据库。"

[dependencies]
symphonia.workspace = true
wasapi.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
# HLS（docs/22 G3）：ureq 同步阻塞 HTTP（引擎线程本来就是阻塞模型，
# 不为拉段引入 tokio）；url 做 playlist→segment 的相对地址解析
ureq.workspace = true
url.workspace = true

[dev-dependencies]
tempfile = "3"

# MMCSS（AvSetMmThreadCharacteristicsW）：把渲染线程注册进 "Pro Audio" 任务组。
# 不加这个，后台有编译/杀毒任务时渲染线程拿不到 CPU 就是欠载爆音——
# 所有正经 Windows 播放器都做这一步。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Threading"] }
