[package]
name = "aiya"
version = "0.1.0"
description = "AIYA Music — 本地优先的桌面音乐播放器（Tauri 2）"
edition = "2021"

# Rust 后端见 crates/（规划）：aiya-player / aiya-data / aiya-audio。
# 本 crate 是 Tauri 宿主壳：命令注册、事件桥、协议注册，不写领域业务（src-tauri/README.md）。

[lib]
name = "aiya_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 产物名 aiya-music.exe（2026-11-05 拍板）：包名保持 aiya（`-p aiya` 类引用
# 零变化），只改 bin 名；分发名仍是 productName 的 "AIYA Music.exe"（安装版
# 与便携版都由打包器/脚本改名，见 build-portable.mjs）。
[[bin]]
name = "aiya-music"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aiya-data = { path = "../crates/aiya-data" }
aiya-player = { path = "../crates/aiya-player" }
aiya-audio = { path = "../crates/aiya-audio" }
# 外部整理工具 client（docs/33 M1）：进程生命周期与 NDJSON 协议都在那里，
# 宿主这里只负责「怎么找到它」和「结果怎么入库」。
aiya-beets-client = { path = "../crates/aiya-beets-client" }
aiya-beets-store = { path = "../crates/aiya-beets-store" }
miow.workspace = true
tokio = { version = "1", features = ["time"] }
tracing.workspace = true
# 日志落盘（logging.rs）：subscriber 写文件，time 只用来取本地时间
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["local-offset"] }
image.workspace = true
rusqlite.workspace = true
ts-rs.workspace = true
# 安装轨道 B：展开套件包
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# 安装物下载（A/B 两轨道的 release 拉取）
ureq.workspace = true
# 下载物 sha256 校验（verify_checksum，SHA256SUMS 清单比对）
sha2.workspace = true
souvlaki = "0.8"
tauri-plugin-single-instance = "2"
[dev-dependencies]
# 安装轨道的临时目录（造假套件包 / 落下载文件）
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# Power：防休眠（smtc.rs）；UI_Shell + Registry：应用身份 AUMID（app_id.rs）；
# Security 是 RegCreateKeyExW 的 SECURITY_ATTRIBUTES 参数依赖；
# WindowsAndMessaging：启动期致命错误弹窗（lib.rs fatal_dialog）。
windows-sys = { version = "0.60", features = [
    "Win32_Globalization",
    "Win32_System_Power",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_Security",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
# windows（带类型的 COM 封装）：app_id.rs 的快捷方式 AUMID 自愈需要
# IShellLinkW/IPropertyStore 接口——windows-sys 不出 COM 接口类型。crate 本体
# 已在依赖树里（souvlaki 经 windows 0.62 引入），这里只是声明 features。
windows = { version = "0.62", features = [
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
