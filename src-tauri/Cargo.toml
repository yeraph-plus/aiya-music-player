[package]
name = "aiya"
version = "0.1.0"
description = "AIYA Music — 本地优先的桌面音乐播放器（Tauri 2）"
edition = "2021"

# Rust 后端见 crates/（规划）：aiya-player / aiya-data / aiya-audio。
# 本 crate 是 Tauri 宿主壳：命令注册、事件桥、协议注册，不写领域业务（src-tauri/README.md）。

[lib]
name = "aiya_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aiya-data = { path = "../crates/aiya-data" }
aiya-player = { path = "../crates/aiya-player" }
aiya-audio = { path = "../crates/aiya-audio" }
# 外部整理工具 client（docs/33 M1）：进程生命周期与 NDJSON 协议都在那里，
# 宿主这里只负责「怎么找到它」和「结果怎么入库」。
aiya-beets-client = { path = "../crates/aiya-beets-client" }
miow.workspace = true
tokio = { version = "1", features = ["time"] }
tracing.workspace = true
# 日志落盘（logging.rs）：subscriber 写文件，time 只用来取本地时间
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["local-offset"] }
image.workspace = true
rusqlite.workspace = true
ts-rs.workspace = true
# 安装轨道 B：展开套件包
zip = { version = "2", default-features = false, features = ["deflate"] }
# 安装物下载（A/B 两轨道的 release 拉取）
ureq.workspace = true
souvlaki = "0.8"
tauri-plugin-single-instance = "2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_Power"] }
